# Run from the repository root. The local replace avoids needing a release tag.
dist:
  module: github.com/databendlabs/opentelemetry-exporter-databend/collector
  name: otelcol-databend
  description: OpenTelemetry Collector with the Databend exporter
  output_path: ./_build

exporters:
  - gomod: github.com/databendlabs/opentelemetry-exporter-databend v0.0.0
    import: github.com/databendlabs/opentelemetry-exporter-databend
    name: databendexporter

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.70.0

replaces:
  - github.com/databendlabs/opentelemetry-exporter-databend => ../
